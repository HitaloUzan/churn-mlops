name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Build MLflow registry state
        # MLflow's local file store resolves artifact paths to an absolute
        # path at creation time — a committed mlflow.db/mlruns/ from another
        # machine won't resolve here. Generate it fresh instead (same
        # reasoning as the Dockerfile's trainer stage — see ADR-009).
        run: python -m src.mlops.train && python -m src.mlops.pipeline

      - name: Test (pytest)
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t churn-mlops-api:ci .
